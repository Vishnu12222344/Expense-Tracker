# for horizontal scaling

services:
  db:
    image: mysql:8.0
    container_name: expense-db
    environment:
      MYSQL_DATABASE: ExpenseTracker_db
      MYSQL_ROOT_PASSWORD: Reddy@2003PP
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: vishnupratapani/expense-tracker-backend:latest
    # REMOVE container_name: expense-backend (Docker will auto-name replicas)
    # REMOVE ports: - "8080:8080" (Internal ports only to avoid host conflicts)
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ExpenseTracker_db

  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8080:80" # Map host 8080 to NGINX, which will route to backends
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  frontend:
    image: vishnupratapani/expense-tracker-frontend:latest
    container_name: expense-frontend
    ports:
      - "8081:8081"
    depends_on:
      - nginx # Now depends on the Load Balancer